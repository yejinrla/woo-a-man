<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>우리 어디서 만나지</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main id="app">
      <section class="boot">
        <p class="eyebrow">공유 약속방</p>
        <h1>우리 어디서 만나지</h1>
        <p>참가자 위치와 취향을 모아 모두에게 덜 부담스러운 만남 장소를 찾고 있어요.</p>
      </section>
    </main>
    <template id="home-template">
      <section class="home-shell">
        <div class="home-copy">
          <p class="eyebrow">실시간 중간지점 추천 웹</p>
          <h1>우리 어디서 만나지</h1>
          <p>친구들이 각자 출발 정보를 고치면 추천 역과 주변 장소, 투표 결과가 같은 방 안에서 바로 맞춰집니다.</p>
          <button class="primary-action" data-action="create-room">새 공유방 만들기</button>
        </div>
        <div class="preview-panel home-form">
          <div class="home-controls">
            <label>
              <span>월</span>
              <select data-home-field="month"></select>
            </label>
            <div class="segmented" role="group" aria-label="시간대">
              <button type="button" data-home-time="낮">낮</button>
              <button type="button" data-home-time="밤">밤</button>
            </div>
          </div>
          <div class="home-tags" aria-label="취향 태그"></div>
          <ol class="preview-list">
            <li>
              <strong>홍대입구역</strong>
              <span>평균 42분 · 3표</span>
            </li>
            <li>
              <strong>합정역</strong>
              <span>평균 45분 · 2표</span>
            </li>
            <li>
              <strong>망원역</strong>
              <span>평균 48분 · 1표</span>
            </li>
          </ol>
        </div>
      </section>
    </template>
    <template id="room-template">
      <section class="app-shell">
        <header class="topbar">
          <div>
            <p class="eyebrow">공유 약속방</p>
            <h1>우리 어디서 만나지</h1>
          </div>
          <button class="icon-button" data-action="copy-link" title="공유 링크 복사" aria-label="공유 링크 복사">공유</button>
        </header>

        <section class="control-band">
          <label>
            <span>월</span>
            <select data-field="month"></select>
          </label>
          <div class="segmented" role="group" aria-label="시간대">
            <button type="button" data-time="낮">낮</button>
            <button type="button" data-time="밤">밤</button>
          </div>
        </section>

        <section class="tag-row" aria-label="취향 태그"></section>

        <section class="workspace">
          <aside class="participants-panel">
            <div class="section-heading">
              <div>
                <p class="eyebrow">함께 수정</p>
                <h2>참가자 위치</h2>
              </div>
              <button class="add-button" data-action="add-participant" title="참가자 추가" aria-label="참가자 추가">+</button>
            </div>
            <div class="participants-list"></div>
          </aside>

          <section class="results-panel">
            <div class="section-heading">
              <div>
                <p class="eyebrow">추천 결과</p>
                <h2>모이기 좋은 곳 5개</h2>
              </div>
              <span class="live-pill">실시간</span>
            </div>
            <div class="recommendation-list"></div>
          </section>

          <section class="map-panel">
            <div class="section-heading">
              <div>
                <p class="eyebrow">지도 보기</p>
                <h2 class="selected-title">추천 장소</h2>
              </div>
              <span class="status-text"></span>
            </div>
            <div class="map-stage" aria-label="추천 지도"></div>
            <div class="place-list"></div>
          </section>
        </section>
      </section>
    </template>
    <script src="/app.js" defer></script>
  </body>
</html>
